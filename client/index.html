<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍿</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Together - Watch YouTube Videos in Sync with Friends</title>
    
    <!-- Console Log & Warning Suppression for Third-Party iFrame Telemetry -->
    <script>
      (function() {
        const origError = console.error;
        const origWarn = console.warn;
        
        function isIgnorable(args) {
          const msg = args.map(a => typeof a === 'string' ? a : (a && a.message) || '').join(' ');
          return (
            msg.includes('www-widgetapi.js') ||
            msg.includes('postMessage') ||
            msg.includes('ERR_BLOCKED_BY_CLIENT') ||
            msg.includes('compute-pressure') ||
            msg.includes('log_event') ||
            msg.includes('react-devtools')
          );
        }

        console.error = function(...args) {
          if (isIgnorable(args)) return;
          origError.apply(console, args);
        };

        console.warn = function(...args) {
          if (isIgnorable(args)) return;
          origWarn.apply(console, args);
        };

        window.addEventListener('error', function(e) {
          if (e && e.message && isIgnorable([e.message])) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>

    <!-- Load YouTube iFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
